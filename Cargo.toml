[package]
name = "code-atlas"
version = "0.1.0"
edition = "2021"
description = "Transactional code graph with PHP analysis, MCP and review analytics"
license = "MIT"
build = "build.rs"

[dependencies]
axum = "=0.7.9"
regex = "=1.11.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_norway = "=0.9.42"
tokio = { version = "=1.54.1", features = ["full"] }

[dev-dependencies]
tempfile = "=3.27.0"
tower = { version = "=0.5.3", features = ["util"] }
http-body-util = "=0.1.5"

[profile.release]
lto = "thin"
strip = true

