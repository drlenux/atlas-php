schema: spec-driven
context: |
  Источник требований: code-atlas-specification.md, версия 0.5 от 2026-11-04.
  Проект: постоянно работающий атлас кода с MCP-доступом, веб-проверкой исправлений
  и наглядной аналитикой использования полученного графа.
  Код представлен вершинами сущностей и типизированными рёбрами отношений.
  PostgreSQL с установленным pgvector и бинарник приложения находятся в одном
  Docker-контейнере на основе PostgreSQL с доступом к папке проекта.
  Поставка — готовый образ drlenux/memory-tools; чужой проект подключает image
  через свой Compose без исходников Atlas и build. Публикация требует отдельной проверки.
  Все предусмотренные настройки приложения передаются через ENV в docker-compose.yml
  и применяются при запуске без изменения исходников и пересборки образа.
  Контракт ENV реализован в src/config.rs и описан в .env.example/README.md.
  Все обновления данных транзакционны. Использование pgvector пока не определено.
  Первые плагины: PHP и расширяющий его анализ Yii 2; далее другие языки и фреймворки.
  Доверие: анализатор 1, агент 2, разработчик 3; для вершин и рёбер отдельно.
  Исправления агента действуют сразу; нижний уровень не перезаписывает верхний.
  Создание и удаление объектов доступны только анализатору; удаление исходного
  кода допускает удаление объекта любого уровня доверия.
  На этапе реализации выбран Rust с Axum/Tokio, PostgreSQL через libpq и собственный
  нативный Rust-плагин PHP и отдельный Rust-плагин Yii2 внутри бинарника.
  PHP CLI, Composer и внешние анализаторы в runtime не требуются.
  Контракт исправлен по уточнению владельца v0.4; см. docs/native-analyzer-design.md.
  MCP закреплён на 2025-11-25. Идентичность, decline, SQL и контракт плагинов
  определены дизайном; исходные открытые вопросы сохранены с указанием решений.
  Подтверждённые проверки и ограничения исполнения находятся в verification.md.
  Приоритеты реализации в порядке владельца: design architecture first;
  design patterns; TDD; Service Layer; SOLID + DRY + KISS + YAGNI;
  Clean Simple Code. Подробные рабочие правила находятся в AGENTS.md.
  Для веб-аналитики рабочая метрика — выдачи MCP-контекста и частота включения
  вершин и рёбер в ответы. Это не доказательство использования агентом в решении.
  Обязательность обратной связи агента о дальнейшем использовании ещё не выбрана.
rules:
  proposal:
    - Писать по-русски, сохраняя обязательные заголовки OpenSpec.
    - Указывать исходное техзадание и отличать требования от предпочтений.
  specs:
    - Использовать SHALL или MUST и хотя бы один Scenario с WHEN и THEN для каждого Requirement.
    - Сохранять ссылки на разделы техзадания и не превращать открытые вопросы в требования.
    - Не добавлять обязательные механизмы из раздела 14 техзадания без нового решения владельца.
  design:
    - Описывать контракт ENV для docker-compose с именами, типами, обязательностью, значениями по умолчанию и обработкой некорректной конфигурации.
    - Сначала описывать архитектуру, ответственности, зависимости и контракты, затем выбирать паттерны под конкретные задачи.
    - Предусматривать Service Layer для прикладных сценариев MCP и веб-интерфейса и обосновывать выбранные паттерны.
    - Применять SOLID, DRY, KISS, YAGNI и Clean Simple Code с сохранением приоритетов владельца.
    - Отличать исходные требования владельца от инженерных решений реализации; актуальные решения находятся в design.md.
  tasks:
    - Ставить архитектурное проектирование перед реализацией зависящего от него поведения.
    - Для исполняемого поведения планировать TDD с проверяемым циклом red-green-refactor на основе сценариев OpenSpec.
    - Указывать способ проверки выполнения каждой задачи и зависимости от открытых решений.
