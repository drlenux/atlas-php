# Publisher-only build recipe. No runtime credentials or inspected project required.
# ATLAS_IMAGE=… docker compose -f docker-compose.build.yml build atlas
# ATLAS_IMAGE=… docker compose -f docker-compose.build.yml push atlas
services:
  atlas:
    image: ${ATLAS_IMAGE:-drlenux/memory-tools:0.3.9}
    build:
      context: .
      dockerfile: Dockerfile
