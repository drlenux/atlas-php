services:
  atlas:
    image: ${ATLAS_IMAGE:-drlenux/memory-tools:0.1.0}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ATLAS_POSTGRES_DB:-atlas}
      POSTGRES_USER: ${ATLAS_POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${ATLAS_POSTGRES_PASSWORD:?Set ATLAS_POSTGRES_PASSWORD in .env}
      PGDATABASE: ${ATLAS_POSTGRES_DB:-atlas}
      PGUSER: ${ATLAS_POSTGRES_USER:-atlas}
      PGPASSWORD: ${ATLAS_POSTGRES_PASSWORD:?Set ATLAS_POSTGRES_PASSWORD in .env}
      ATLAS_DATABASE_URL: ${ATLAS_DATABASE_URL:-host=127.0.0.1 connect_timeout=5}
      ATLAS_PROJECT_ROOT: /project
      ATLAS_BIND: 0.0.0.0:8080
      ATLAS_AGENT_TOKEN: ${ATLAS_AGENT_TOKEN:?Set ATLAS_AGENT_TOKEN in .env}
      ATLAS_REVIEW_TOKEN: ${ATLAS_REVIEW_TOKEN:?Set a different ATLAS_REVIEW_TOKEN in .env}
      ATLAS_CPU_LIMIT: ${ATLAS_CPU_LIMIT:-1}
      ATLAS_INDEX_WORKERS: ${ATLAS_INDEX_WORKERS:-0}
      ATLAS_MEMORY_LIMIT_MB: ${ATLAS_MEMORY_LIMIT_MB:-1024}
      ATLAS_ALLOWED_ORIGINS: '${ATLAS_ALLOWED_ORIGINS:-["http://localhost:${ATLAS_HOST_PORT:-8080}","http://127.0.0.1:${ATLAS_HOST_PORT:-8080}"]}'
    volumes:
      - atlas-postgres:/var/lib/postgresql/data
      - type: bind
        source: ${ATLAS_HOST_PROJECT_ROOT:-.}
        target: /project
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:${ATLAS_HOST_PORT:-8080}:8080"
    cpus: ${ATLAS_CPU_LIMIT:-1}
    mem_limit: ${ATLAS_MEMORY_LIMIT_MB:-1024}m
    stop_grace_period: 30s

volumes:
  atlas-postgres:
