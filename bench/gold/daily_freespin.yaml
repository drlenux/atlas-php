# Ground truth for DailyFreespinController design task (benchmark 2).
# Freeze slotor commit + Atlas image before runs. Build this list before agents run.

task: daily-freespin-controller
source_reports: [report2.md, report2_v2.md]
modes: [atlas_any_tools, grep_only]
n_per_mode: 5

must_find:
  - id: create_freespin_path
    description: Staff path to issue FS is Freespin::createFreeSpin (not ad-hoc insert)
    paths:
      - common/models/Freespin.php
    tokens_any: [createFreeSpin]

  - id: lock_take_bonuses
    description: Neighbouring guard isLockTakeBonuses before issuing bonuses/FS
    paths: []
    tokens_any: [isLockTakeBonuses]
    # Atlas signal after R3: called_by/preconditions show the guard when present
    # on a caller of createFreeSpin; if not on createFreeSpin callers, agent must
    # still copy it from actionActivateBonus / similar bonus actions.
    note: "Atlas agents historically skipped this when only following call graph"

  - id: cancel_auto_semantics
    description: What counts as "already received today" — CANCEL_AUTO handling
    tokens_any: [CANCEL_AUTO, STATUS_ERROR]

  - id: last_game
    description: Last real (non-demo) game source for targeting FS
    tokens_any: [UserLastGame, getLastGames, setData]

success:
  atlas_any_tools:
    lock_take_bonuses: ">=4/5"
    create_freespin_path: ">=4/5"
  reject_if:
    - "atlas recall on lock_take_bonuses < grep recall"
    - "server Storage operation failed > 0"
